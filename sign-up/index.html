<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="./SignUp.css" />
  </head>
  <body>
    <div class="auth-page signUpContainer">
      <!-- Return navigation to the landing page. -->
      <div class="nav-back">
        <a href="../index.html" class="back"
          ><i class="fas fa-chevron-left"></i> Back</a
        >
      </div>
      <div class="auth-card signUp">
        <!-- Account creation form and agreement controls. -->
        <div class="sign-up-content">
          <h1>Get Started</h1>
        </div>
        <div class="form-container">
          <form method="post" class="sign-up-form">
            <div class="input">
              <label for="full-name">Full Name</label>
              <input
                type="text"
                name="full_name"
                id="full-name"
                class="input-fields"
                required
                placeholder="Enter Full Name"
                autocomplete="name"
              />
            </div>
            <div class="input">
              <label for="email">Email</label>
              <input
                type="email"
                name="email"
                id="email"
                required
                class="input-fields"
                placeholder="Enter Email"
                autocomplete="email"
              />
            </div>
            <div class="input">
              <label for="password">Password</label>
              <input
                type="password"
                name="password"
                id="password"
                class="input-fields"
                required
                placeholder="Enter Password"
                autocomplete="new-password"
              />
            </div>
            <div class="agreement">
              <div class="checkbox">
                <input
                  type="checkbox"
                  name="checkbox"
                  id="checkbox"
                  class="checkbox"
                />
              </div>
              <div class="agree">
                <label for="checkbox" class="check-box-label"
                  >I agree to the processing of
                  <a class="blue-link" href="#"
                    ><span class="blue">Personal data</span></a
                  >
                </label>
              </div>
            </div>
            <div class="form-sign-up-button">
              <button type="submit" class="btn-sign-up">Sign Up</button>
            </div>
          </form>

          <!-- Alternative sign-up methods and existing-account link. -->
          <div class="footer">
            <div class="content-box">
              <hr />
              <p class="content-title">Sign up with</p>
            </div>
            <div class="icons">
              <a href=""><i class="fab fa-facebook"></i></a>
              <a href=""><i class="fab fa-twitter"></i></a>
              <a href=""><i class="fab fa-google"></i></a>
              <a href=""><i class="fab fa-apple"></i></a>
            </div>

            <div class="account">
              <p class="account-footer">
                Already have an account?
                <a class="blue-link" href="../sign-in/index.html"
                  ><span class="blue">Sign in</span></a
                >
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
