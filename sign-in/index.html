<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="./SignIn.css" />
  </head>
  <body>
    <div class="auth-page signInContainer">
      <!-- Return navigation to the landing page. -->
      <div class="nav-back">
        <a href="../index.html" class="back"
          ><i class="fas fa-chevron-left"></i> Back</a
        >
      </div>
      <div class="auth-card signIn">
        <!-- Sign-in form and account recovery controls. -->
        <div class="sign-in-content">
          <h1>Welcome back</h1>
        </div>
        <div class="form-container">
          <form method="post" class="sign-in-form">
            <label for="email">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              required
              placeholder="Enter Email"
            />
            <label for="password">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              required
              placeholder="Enter Password"
            />

            <div class="flex-container content">
              <div class="input-checkbox">
                <input
                  type="checkbox"
                  name="checkbox"
                  id="checkbox"
                  class="checkbox"
                />
                <label for="checkbox" class="check-box-label"
                  >Remember me
                </label>
              </div>
              <a class="forgot" href="#">Forgot password</a>
            </div>
            <div class="form-sign-in-button">
              <button type="submit" class="btn-sign-in">Sign in</button>
            </div>
          </form>

          <!-- Alternative sign-in methods and account registration link. -->
          <div class="content-box">
            <hr />
            <p class="content-title">Sign in with</p>
          </div>
          <div class="icons">
            <a href=""><i class="fab fa-facebook"></i></a>
            <a href=""><i class="fab fa-twitter"></i></a>
            <a href=""><i class="fab fa-google"></i></a>
            <a href=""><i class="fab fa-apple"></i></a>
          </div>

          <p class="footer">
            Don't have an account?
            <a class="blue-link" href="../sign-up/index.html"
              ><span class="blue">Sign up</span></a
            >
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
